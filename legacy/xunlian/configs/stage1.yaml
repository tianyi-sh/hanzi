# Stage 1: 遮蔽重建 (MAE) - 轨迹重建
stage: 1
name: stage1_mae

data:
  pairs_csv: "data/raw/pairs.csv"
  processed_dir: "data/processed/samples"
  traj_dim: 5       # x, y, f, speed, dt
  mask_ratio: 0.25  # 遮蔽比例

model:
  traj_encoder: "lstm"
  hidden_size: 128
  num_layers: 2
  dropout: 0.1
  pred_dim: 3       # 预测 x, y, f

train:
  batch_size: 4
  epochs: 30
  lr: 1e-3
  weight_decay: 0

eval:
  metrics: ["reconstruction_mae"]

output_dir: "outputs/runs"

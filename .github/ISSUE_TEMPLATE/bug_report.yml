name: Bug 报告
description: 报告可复现的程序错误
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供命令、配置和最小复现步骤。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11, Python 3.11, PyTorch 2.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或报错
      render: shell

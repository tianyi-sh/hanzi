# Stage 4: 少标注微调（约 10% 标注数据，质量标签）
stage: 4
name: stage4_finetune

data:
  processed_dir: "data/processed/samples"
  label_ratio: 0.1
  # 需提供质量标签文件（如 quality_labels.csv: sample_id, score 或 label）

model:
  traj_encoder:
    type: "lstm"
    hidden_size: 128
    num_layers: 2
  score_head: true

train:
  batch_size: 4
  epochs: 15
  lr: 5e-4
  loss: "mse"  # 回归质量分 或 ce 分类

eval:
  metrics: ["MAE", "RMSE"]

output_dir: "outputs/runs"
